name: Cross-OS collaboration

# Windows, macOS and Linux runners connect to each other over the internet
# at the same time, proving mixed-OS collaboration works. Runs nightly, on
# release tags, when the collaboration transport changes, and by hand.
on:
  schedule:
    - cron: '17 3 * * *'
  push:
    tags: ['v*']
  pull_request:
    paths: ['src-tauri/src/collab*.rs', 'src-tauri/Cargo.lock', '.github/workflows/cross-os.yml']
  workflow_dispatch:

jobs:
  mesh:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      - run: mkdir -p dist
      # Build first so all three runners start the actual test at about the same time.
      - working-directory: src-tauri
        run: cargo test --locked --no-run
      - working-directory: src-tauri
        env:
          EGD_MESH_SELF: ${{ matrix.name }}
          EGD_MESH_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: cargo test --locked cross_os_mesh -- --ignored --nocapture
