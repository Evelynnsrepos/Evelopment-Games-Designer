name: macOS build

# Builds an unsigned universal (Apple Silicon + Intel) .dmg.
# Run it from the Actions tab, or push a tag like v0.2.0.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npx tauri build --target universal-apple-darwin --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: evelopment-games-designer-macos
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
