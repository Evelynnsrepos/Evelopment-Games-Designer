name: CI

# Checks every push and pull request on Windows, macOS and Linux, so features
# like collaboration are verified on all three systems the app ships for.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Tauri's build script needs the frontend output folder to exist.
      - run: npm run build
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
      # Real internet test: two peers talk through the public relay, on each OS.
      - name: Collaboration network test (relay)
        working-directory: src-tauri
        run: cargo test --locked -- --ignored
