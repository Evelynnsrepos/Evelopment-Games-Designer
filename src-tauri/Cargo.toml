[package]
name = "evelopment-games-designer"
version = "0.10.0"
description = "Evelopment Games Designer: a free all-in-one game design tool"
authors = ["Evelopment Games"]
license = "GPL-3.0-only"
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "egd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
spellbook = "0.4"
ureq = { version = "3", features = ["json"] }
anyhow = "1.0.104"
iroh = "1.3.0"
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "io-util", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "__rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-platform-verifier = "0.7"
sha2 = "0.10"
futures-util = "0.3"
