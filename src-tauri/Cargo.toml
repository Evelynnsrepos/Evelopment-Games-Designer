[package]
name = "evelopment-games-designer"
version = "0.1.0"
description = "Evelopment Games Designer: a free all-in-one game design tool"
authors = ["Evelynn"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "egd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
